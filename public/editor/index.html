
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1729">
  <meta name="robots" content="noindex,nofollow">
  <title>محرر المقالات | DevAhmad</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0c1729;
      color: #f5f8ff;
      font-family: Tahoma, Arial, sans-serif;
      line-height: 1.8;
    }

    .container {
      width: min(calc(100% - 28px), 760px);
      margin: auto;
    }

    header {
      padding: 18px 0;
      border-bottom: 1px solid #30435e;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      font-size: 23px;
      font-weight: bold;
    }

    a {
      color: #86b6ff;
    }

    main {
      padding: 25px 0 60px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    h2 {
      font-size: 20px;
    }

    .muted {
      color: #b1c0d4;
      font-size: 14px;
    }

    .card {
      background: #17263e;
      border: 1px solid #30435e;
      border-radius: 18px;
      padding: 20px;
      margin: 18px 0;
    }

    label {
      display: block;
      margin: 17px 0 7px;
      font-size: 14px;
      font-weight: bold;
    }

    input,
    textarea {
      display: block;
      width: 100%;
      min-width: 0;
      padding: 13px;
      border: 1px solid #50627c;
      border-radius: 10px;
      background: #fff;
      color: #17263e;
      font: 16px Tahoma, Arial, sans-serif;
    }

    textarea {
      resize: vertical;
      line-height: 1.9;
    }

    button {
      min-height: 47px;
      padding: 11px 17px;
      border: 0;
      border-radius: 11px;
      font: bold 15px Tahoma, Arial, sans-serif;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .primary {
      background: #86b6ff;
      color: #0c1729;
    }

    .secondary {
      background: #30435e;
      color: #fff;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 23px;
    }

    .actions button {
      flex: 1;
    }

    .status {
      padding: 13px;
      border-radius: 10px;
      background: #233650;
      margin-top: 16px;
      overflow-wrap: anywhere;
    }

    .success {
      background: #164735;
    }

    .error {
      background: #663034;
    }

    .hidden {
      display: none !important;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 17px;
    }

    .check input {
      width: 20px;
      height: 20px;
    }

    .check label {
      margin: 0;
    }

    #preview {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    @media (max-width: 380px) {
      .card {
        padding: 15px;
      }

      h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="container header-inner">
      <div class="brand">DevAhmad</div>
      <a href="/dashboard/">لوحة التحكم ←</a>
    </div>
  </header>

  <main class="container">

    <h1>محرر المقالات</h1>

    <p class="muted">
      كتابة المقالات ونشرها مباشرة من الهاتف.
    </p>

    <section id="loginBox" class="card">

      <h2>تسجيل الدخول</h2>

      <p class="muted">
        استخدم حساب GitHub الذي يملك صلاحية
        النشر في مستودع DevAhmad.
      </p>

      <button
        id="loginBtn"
        type="button"
        class="primary"
      >
        تسجيل الدخول باستخدام GitHub
      </button>

      <div
        id="loginStatus"
        class="status hidden"
        role="status"
      ></div>

    </section>

    <section id="editorBox" class="hidden">

      <div class="card">

        <h2>مقال جديد</h2>

        <form id="articleForm">

          <label for="title">عنوان المقال *</label>
          <input id="title" required>

          <label for="slug">رابط المقال *</label>
          <input
            id="slug"
            dir="ltr"
            required
            pattern="[a-z0-9-]+"
            placeholder="my-new-article"
          >

          <p class="muted">
            استخدم الحروف الإنجليزية الصغيرة
            والأرقام والشرطة فقط.
          </p>

          <label for="description">
            وصف مختصر *
          </label>

          <textarea
            id="description"
            rows="3"
            required
          ></textarea>

          <label for="date">تاريخ النشر *</label>
          <input id="date" type="date" required>

          <label for="category">التصنيف *</label>
          <input id="category" required>

          <label for="tags">الوسوم</label>
          <input
            id="tags"
            placeholder="TypeScript, Web"
          >

          <label for="cover">
            رابط صورة الغلاف
          </label>

          <input
            id="cover"
            dir="ltr"
            placeholder="/uploads/cover.jpg"
          >

          <label for="body">
            محتوى المقال *
          </label>

          <textarea
            id="body"
            rows="13"
            required
          ></textarea>

          <div class="check">
            <input id="draft" type="checkbox">
            <label for="draft">حفظ كمسودة</label>
          </div>

          <div class="check">
            <input id="featured" type="checkbox">
            <label for="featured">مقال مميز</label>
          </div>

          <div class="actions">

            <button
              id="previewBtn"
              type="button"
              class="secondary"
            >
              معاينة
            </button>

            <button
              id="publishBtn"
              type="submit"
              class="primary"
            >
              نشر المقال
            </button>

          </div>

        </form>

        <div
          id="publishStatus"
          class="status hidden"
          role="status"
        ></div>

      </div>

      <section
        id="previewBox"
        class="card hidden"
      >
        <h2>معاينة المقال</h2>
        <div id="preview"></div>
      </section>

    </section>

  </main>

  <script>
    "use strict";

    const REPO = "astalmn/devahmad-blog";
    const ORIGIN = window.location.origin;

    const $ = id => document.getElementById(id);

    let githubToken = null;
    let loginPopup = null;

    function showStatus(id, message, type = "") {
      const element = $(id);
      element.textContent = message;
      element.className = "status " + type;
    }

    function closeLoginPopup() {
      try {
        if (loginPopup && !loginPopup.closed) {
          loginPopup.close();
        }
      } catch (error) {
        // قد يمنع متصفح الهاتف إغلاق النافذة.
      }

      loginPopup = null;
    }

    // استقبال رسائل المصادقة من نافذة GitHub.

    window.addEventListener(
      "message",
      async event => {

        if (event.origin !== ORIGIN) {
          return;
        }

        if (!loginPopup) {
          return;
        }

        if (event.source !== loginPopup) {
          return;
        }

        const message = event.data;

        if (message === "authorizing:github") {
          loginPopup.postMessage(
            "authorizing:github",
            ORIGIN
          );

          return;
        }

        if (typeof message !== "string") {
          return;
        }

        const successPrefix =
          "authorization:github:success:";

        const errorPrefix =
          "authorization:github:error:";

        if (message.startsWith(successPrefix)) {

          try {
            const result = JSON.parse(
              message.slice(successPrefix.length)
            );

            if (!result.token) {
              throw new Error("Missing token");
            }

            githubToken = result.token;

            showStatus(
              "loginStatus",
              "تم تسجيل الدخول. جارٍ التحقق من الصلاحيات..."
            );

            closeLoginPopup();

            await verifyAccess();

          } catch (error) {

            githubToken = null;

            showStatus(
              "loginStatus",
              "تعذر إكمال تسجيل الدخول.",
              "error"
            );

          }

          return;
        }

        if (message.startsWith(errorPrefix)) {

          closeLoginPopup();

          showStatus(
            "loginStatus",
            "فشل تسجيل الدخول إلى GitHub.",
            "error"
          );

        }

      }
    );

    // فتح نافذة تسجيل الدخول.

    $("loginBtn").addEventListener(
      "click",
      () => {

        showStatus(
          "loginStatus",
          "جارٍ فتح GitHub..."
        );

        loginPopup = window.open(
          "/api/auth",
          "devahmad_editor_login",
          "width=600,height=750"
        );

        if (!loginPopup) {

          showStatus(
            "loginStatus",
            "تعذر فتح النافذة. اسمح بالنوافذ المنبثقة في Chrome.",
            "error"
          );

          return;
        }

        showStatus(
          "loginStatus",
          "أكمل تسجيل الدخول في نافذة GitHub."
        );

      }
    );

    // الاتصال بواجهة GitHub API.

    async function github(path, options = {}) {

      if (!githubToken) {
        throw new Error("Not authenticated");
      }

      const response = await fetch(
        "https://api.github.com/" + path,
        {
          ...options,

          headers: {
            Accept: "application/vnd.github+json",
            Authorization: "Bearer " + githubToken,
            "X-GitHub-Api-Version": "2022-11-28",
            ...(options.headers || {})
          }
        }
      );

      if (!response.ok) {

        const error = new Error(
          "GitHub API: " + response.status
        );

        error.status = response.status;

        throw error;
      }

      return response.json();
    }

    // التحقق من صلاحية النشر.

    async function verifyAccess() {

      try {

        const repo = await github(
          "repos/" + REPO
        );

        if (!repo.permissions?.push) {
          throw new Error("No write permission");
        }

        $("loginBox").classList.add("hidden");
        $("editorBox").classList.remove("hidden");

      } catch (error) {

        githubToken = null;

        $("editorBox").classList.add("hidden");
        $("loginBox").classList.remove("hidden");

        showStatus(
          "loginStatus",
          "تعذر التحقق من صلاحية النشر.",
          "error"
        );

      }
    }

    // تحويل النصوص إلى قيم YAML.

    function yamlString(value) {
      return JSON.stringify(String(value));
    }

    // إنشاء محتوى المقال.

    function createMarkdown() {

      const tags = $("tags").value
        .split(",")
        .map(tag => tag.trim())
        .filter(Boolean);

      const lines = [
        "---",

        "title: " +
          yamlString($("title").value.trim()),

        "description: " +
          yamlString($("description").value.trim()),

        "date: " +
          yamlString($("date").value),

        "category: " +
          yamlString($("category").value.trim()),

        "tags: [" +
          tags.map(yamlString).join(", ") +
          "]",

        "lang: ar",

        "draft: " +
          $("draft").checked,

        "featured: " +
          $("featured").checked
      ];

      const cover = $("cover").value.trim();

      if (cover) {
        lines.push(
          "cover: " + yamlString(cover)
        );
      }

      lines.push("---");
      lines.push("");
      lines.push($("body").value);
      lines.push("");

      return lines.join("\n");
    }

    // تحويل المقال إلى Base64.

    function base64Utf8(text) {

      const bytes = new TextEncoder().encode(text);

      let binary = "";

      for (
        let i = 0;
        i < bytes.length;
        i += 8192
      ) {

        binary += String.fromCharCode(
          ...bytes.subarray(i, i + 8192)
        );

      }

      return btoa(binary);
    }

    // معاينة المقال دون تنفيذ HTML.

    $("previewBtn").addEventListener(
      "click",
      () => {

        const preview = $("preview");

        preview.textContent =
          $("title").value +
          "\n\n" +
          $("description").value +
          "\n\n" +
          $("body").value;

        $("previewBox").classList.remove("hidden");

        $("previewBox").scrollIntoView({
          behavior: "smooth"
        });

      }
    );

    // نشر مقال جديد.

    $("articleForm").addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        if (!githubToken) {

          showStatus(
            "publishStatus",
            "سجّل الدخول أولًا.",
            "error"
          );

          return;
        }

        const slug = $("slug").value.trim();

        if (
          !/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug)
        ) {

          showStatus(
            "publishStatus",
            "رابط المقال غير صالح.",
            "error"
          );

          return;
        }

        const button = $("publishBtn");

        button.disabled = true;

        showStatus(
          "publishStatus",
          "جارٍ حفظ المقال في GitHub..."
        );

        try {

          const path =
            "src/content/blog/" +
            slug +
            ".md";

          await github(
            "repos/" +
            REPO +
            "/contents/" +
            path,
            {
              method: "PUT",

              body: JSON.stringify({
                message:
                  "Add article: " +
                  $("title").value.trim(),

                content: base64Utf8(
                  createMarkdown()
                ),

                branch: "main"
              })
            }
          );

          showStatus(
            "publishStatus",
            "تم حفظ المقال في GitHub. انتظر اكتمال نشر Cloudflare.",
            "success"
          );

        } catch (error) {

          const message =
            error.status === 422
              ? "يوجد مقال بنفس الرابط. اختر رابطًا آخر."
              : "فشل الحفظ. رمز الخطأ: " +
                (error.status || "غير معروف");

          showStatus(
            "publishStatus",
            message,
            "error"
          );

        } finally {

          button.disabled = false;

        }

      }
    );

    // تحديد تاريخ اليوم تلقائيًا.

    const now = new Date();

    const localDate = new Date(
      now.getTime() -
      now.getTimezoneOffset() * 60000
    );

    $("date").value =
      localDate.toISOString().slice(0, 10);

  </script>

</body>
        </html>
