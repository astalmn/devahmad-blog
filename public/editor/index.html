<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محرر DevAhmad</title><style>body{margin:0;background:#0b1220;color:#edf3fc;font:16px Tahoma,Arial;line-height:1.8}main{max-width:900px;margin:auto;padding:20px}header,.card{background:#111c30;border:1px solid #30415c;border-radius:12px;padding:18px;margin:12px 0}h1{margin:0}a{color:#93c5fd}button,.btn{display:inline-block;cursor:pointer;background:#2563eb;color:white;border:0;border-radius:9px;padding:11px 17px;margin:4px;text-decoration:none;font:inherit}button:disabled{opacity:.5}input,textarea{box-sizing:border-box;display:block;width:100%;background:#192943;border:1px solid #435776;color:white;padding:12px;border-radius:8px;font:inherit;margin:5px 0 14px}textarea{min-height:130px}#editContent{min-height:430px;direction:ltr;text-align:left;font:14px monospace}#body{min-height:280px}.hidden{display:none}.error{color:#fca5a5}.success{color:#86efac}.article{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #30415c;padding:12px 0;flex-wrap:wrap}.danger{background:#b91c1c}.secondary{background:#334155}.row{display:flex;gap:8px;flex-wrap:wrap}.note{color:#b9c6d9;font-size:14px}label{display:block;font-weight:bold}#editStatus,#listStatus,#publishStatus{white-space:pre-wrap}</style></head><body><main><header><h1>DevAhmad | إدارة المقالات</h1><a href="/">الرئيسية</a> · <a href="/dashboard/">لوحة التحكم</a></header><section id="loginBox" class="card"><p>سجّل الدخول لإدارة المقالات.</p><a class="btn" href="/api/editor-login">تسجيل الدخول باستخدام GitHub</a><p id="loginStatus" class="note">جارٍ التحقق...</p></section><section id="editorBox" class="hidden"><div class="row"><button id="listTab">المقالات الموجودة</button><button id="newTab" class="secondary">إنشاء مقال جديد</button></div><section id="listPanel" class="card"><h2>المقالات الموجودة</h2><input id="search" placeholder="ابحث باسم المقال"><button id="refreshBtn" class="secondary">تحديث القائمة</button><p id="listStatus"></p><div id="articleList"></div></section><section id="editPanel" class="card hidden"><h2>تعديل المقال</h2><p id="editingName" class="note"></p><p class="note">عدّل ملف Markdown كاملًا، واحتفظ ببيانات المقال بين علامتَي ---.</p><textarea id="editContent" spellcheck="false"></textarea><div class="row"><button id="saveEditBtn">حفظ التعديلات</button><button id="deleteBtn" class="danger">حذف المقال</button><button id="cancelEditBtn" class="secondary">العودة للقائمة</button></div><p id="editStatus"></p></section><section id="newPanel" class="card hidden"><h2>مقال جديد</h2><form id="articleForm"><label>العنوان<input id="title" required maxlength="180"></label><label>رابط المقال بالإنجليزية<input id="slug" dir="ltr" required pattern="[a-z0-9]+(-[a-z0-9]+)*"></label><label>الوصف<textarea id="description" required></textarea></label><label>التاريخ<input id="date" type="date" required></label><label>التصنيف<input id="category" required></label><label>الوسوم، مفصولة بفواصل<input id="tags"></label><label>رابط صورة الغلاف<input id="cover"></label><label>المحتوى<textarea id="body" required></textarea></label><label><input id="draft" type="checkbox" style="display:inline;width:auto"> مسودة</label><label><input id="featured" type="checkbox" style="display:inline;width:auto"> مقال مميز</label><button id="publishBtn" type="submit">حفظ المقال في GitHub</button><p id="publishStatus"></p></form></section></section></main><script>
'use strict';const $=id=>document.getElementById(id);let articles=[],current=null,busy=false;function message(id,s,ok){$(id).textContent=s;$(id).className=ok===true?'success':ok===false?'error':''}async function api(url,opts={}){let r=await fetch(url,{credentials:'same-origin',cache:'no-store',...opts});let d;try{d=await r.json()}catch{throw Error('استجابة غير صالحة من الخادم')}if(!r.ok)throw Error(d.error||'HTTP '+r.status);return d}function panel(name){for(let n of ['list','edit','new'])$(n+'Panel').classList.toggle('hidden',n!==name)}function guard(){return !current||$('editContent').value===current.content||confirm('توجد تعديلات غير محفوظة. هل تريد المغادرة؟')}async function load(){message('listStatus','جارٍ التحميل...');try{let d=await api('/api/editor-articles');articles=d.articles||[];render();message('listStatus','عدد المقالات: '+articles.length,true)}catch(e){message('listStatus',e.message,false)}}function render(){let q=$('search').value.trim().toLowerCase(),box=$('articleList');box.replaceChildren();for(let a of articles.filter(x=>x.slug.toLowerCase().includes(q))){let row=document.createElement('div'),name=document.createElement('span'),btn=document.createElement('button');row.className='article';name.textContent=a.slug;btn.textContent='فتح وتعديل';btn.onclick=()=>openArticle(a.slug);row.append(name,btn);box.append(row)}if(!box.children.length)box.textContent='لا توجد مقالات مطابقة'}async function openArticle(slug){if(busy)return;busy=true;message('listStatus','جارٍ فتح المقال...');try{let d=await api('/api/editor-articles?slug='+encodeURIComponent(slug));current={slug:d.slug,sha:d.sha,content:d.content};$('editingName').textContent=d.slug;$('editContent').value=d.content;message('editStatus','');panel('edit');window.scrollTo(0,0)}catch(e){message('listStatus',e.message,false)}finally{busy=false}}async function save(){if(!current||busy)return;let content=$('editContent').value;if(!/^---\r?\n/.test(content)){message('editStatus','يجب أن يبدأ الملف بعلامات ---',false);return}busy=true;$('saveEditBtn').disabled=true;message('editStatus','جارٍ الحفظ...');try{let d=await api('/api/editor-manage',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug:current.slug,sha:current.sha,content})});current.sha=d.sha;current.content=content;message('editStatus','تم الحفظ في GitHub. انتظر نشر Cloudflare.',true)}catch(e){message('editStatus',e.message,false)}finally{busy=false;$('saveEditBtn').disabled=false}}async function remove(){if(!current||busy)return;let slug=current.slug;if(prompt('للتأكيد، اكتب اسم المقال المراد حذفه:\n'+slug)!==slug)return;busy=true;$('deleteBtn').disabled=true;message('editStatus','جارٍ الحذف...');try{await api('/api/editor-manage',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug,sha:current.sha})});current=null;panel('list');await load();message('listStatus','تم الحذف من GitHub. انتظر نشر Cloudflare.',true)}catch(e){message('editStatus',e.message,false)}finally{busy=false;$('deleteBtn').disabled=false}}$('search').oninput=render;$('refreshBtn').onclick=load;$('listTab').onclick=()=>{if(!guard())return;current=null;panel('list');load()};$('newTab').onclick=()=>{if(!guard())return;current=null;panel('new')};$('cancelEditBtn').onclick=()=>{if(!guard())return;current=null;panel('list');load()};$('saveEditBtn').onclick=save;$('deleteBtn').onclick=remove;$('articleForm').onsubmit=async e=>{e.preventDefault();let b=$('publishBtn');b.disabled=true;message('publishStatus','جارٍ الحفظ...');let data={title:$('title').value.trim(),slug:$('slug').value.trim(),description:$('description').value.trim(),date:$('date').value,category:$('category').value.trim(),tags:$('tags').value.split(',').map(s=>s.trim()).filter(Boolean),cover:$('cover').value.trim(),body:$('body').value,draft:$('draft').checked,featured:$('featured').checked};try{await api('/api/editor-publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});message('publishStatus','تم حفظ المقال في GitHub.',true)}catch(err){message('publishStatus',err.message,false)}finally{b.disabled=false}};let d=new Date();$('date').value=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);(async()=>{try{let s=await api('/api/editor-status');if(!s.authenticated)throw Error('غير مسجل');$('loginBox').classList.add('hidden');$('editorBox').classList.remove('hidden');await load()}catch(e){$('loginStatus').textContent='سجّل الدخول باستخدام GitHub، أو أعد تحميل الصفحة.'}})();
</script></body></html>
