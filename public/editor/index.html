<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محرر DevAhmad</title><style>
:root{color-scheme:dark;--bg:#080f1e;--surface:#111d31;--surface2:#182942;--line:#344864;--text:#edf4ff;--muted:#b6c6dc;--primary:#3b82f6;--focus:#93c5fd}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 80% -10%,#172b4b,transparent 38%),var(--bg);color:var(--text);font:16px/1.85 system-ui,Tahoma,Arial,sans-serif}main{max-width:980px;margin:auto;padding:clamp(12px,3vw,30px)}header,.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(16px,3vw,26px);margin:14px 0;box-shadow:0 6px 24px #0002}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:clamp(22px,4vw,30px);margin:0}h2{font-size:21px;margin:0 0 16px}a{color:#a8ceff}button,.btn{display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:var(--primary);color:white;border:1px solid transparent;border-radius:10px;padding:10px 17px;margin:4px 2px;text-decoration:none;font:600 15px/1.5 inherit;min-height:44px;transition:background .15s,transform .15s}button:hover,.btn:hover{background:#2563eb}button:active{transform:scale(.99)}button:disabled{opacity:.55;cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:3px}input,textarea{display:block;width:100%;background:var(--surface2);border:1px solid #536b8d;color:white;padding:12px;border-radius:10px;font:inherit;margin:6px 0 16px;min-height:46px}input::placeholder{color:#b7c4d6}textarea{min-height:135px;resize:vertical}#editContent{min-height:450px;direction:ltr;text-align:left;font:14px/1.75 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:2}#body{min-height:290px}.hidden{display:none!important}.error{color:#ffb4b4}.success{color:#8ff2b5}.article{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:12px 15px;margin:9px 0;flex-wrap:wrap;overflow-wrap:anywhere}.article span{font-weight:600}.danger{background:#b91c1c}.danger:hover{background:#991b1b}.secondary{background:#334155}.secondary:hover{background:#475569}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.note{color:var(--muted);font-size:14px}label{display:block;font-weight:600}#editStatus,#listStatus,#publishStatus{white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.8em}#search{margin-top:8px}#draft,#featured{display:inline-block;width:20px;height:20px;vertical-align:middle;margin-inline-end:6px;accent-color:var(--primary)}@media(max-width:560px){header{align-items:flex-start}.row button{flex:1 1 auto}.article button{width:100%}#saveEditBtn,#deleteBtn,#cancelEditBtn{flex-basis:100%}#editContent{min-height:55vh}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}button,.btn{transition:none}}
</style></head><body><main><header><h1>DevAhmad | إدارة المقالات</h1><nav aria-label="روابط الموقع"><a href="/">الرئيسية</a> · <a href="/dashboard/">لوحة التحكم</a> · <button id="logoutBtn" type="button" class="secondary hidden">تسجيل الخروج</button></nav></header><section id="loginBox" class="card"><p>سجّل الدخول لإدارة المقالات.</p><a class="btn" href="/api/editor-login">تسجيل الدخول باستخدام GitHub</a><p id="loginStatus" class="note" role="status">جارٍ التحقق...</p></section><section id="editorBox" class="hidden"><div class="row"><button id="listTab" type="button">المقالات الموجودة</button><button id="newTab" type="button" class="secondary">إنشاء مقال جديد</button></div><section id="listPanel" class="card"><h2>المقالات الموجودة</h2><input id="search" type="search" aria-label="البحث عن مقال" placeholder="ابحث باسم المقال"><button id="refreshBtn" type="button" class="secondary">تحديث القائمة</button><p id="listStatus" role="status"></p><div id="articleList"></div></section><section id="editPanel" class="card hidden"><h2>تعديل المقال</h2><p id="editingName" class="note"></p><p class="note">عدّل ملف Markdown كاملًا، واحتفظ ببيانات المقال بين علامتَي ---.</p><textarea id="editContent" spellcheck="false"></textarea><div class="row"><button id="saveEditBtn" type="button">حفظ التعديلات</button><button id="deleteBtn" type="button" class="danger">حذف المقال</button><button id="cancelEditBtn" type="button" class="secondary">العودة للقائمة</button></div><p id="editStatus" role="status"></p></section><section id="newPanel" class="card hidden"><h2>مقال جديد</h2><form id="articleForm"><label>العنوان<input id="title" required maxlength="180"></label><label>رابط المقال بالإنجليزية<input id="slug" dir="ltr" required pattern="[a-z0-9]+(-[a-z0-9]+)*"></label><label>الوصف<textarea id="description" required></textarea></label><label>التاريخ<input id="date" type="date" required></label><label>التصنيف<input id="category" required></label><label>الوسوم، مفصولة بفواصل<input id="tags"></label><label>رابط صورة الغلاف<input id="cover"></label><label>المحتوى<textarea id="body" required></textarea></label><label><input id="draft" type="checkbox" style="display:inline;width:auto"> مسودة</label><label><input id="featured" type="checkbox" style="display:inline;width:auto"> مقال مميز</label><button id="publishBtn" type="submit">حفظ المقال في GitHub</button><p id="publishStatus" role="status"></p></form></section></section></main><script>
'use strict';const $=id=>document.getElementById(id);let articles=[],current=null,busy=false;function message(id,s,ok){$(id).textContent=s;$(id).className=ok===true?'success':ok===false?'error':''}async function api(url,opts={}){let controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),20000),r;try{r=await fetch(url,{credentials:'same-origin',cache:'no-store',signal:controller.signal,...opts})}catch(e){throw Error(e.name==='AbortError'?'انتهت مهلة الاتصال. تحقق من الإنترنت وأعد المحاولة.':'تعذر الاتصال بالخادم. تحقق من الإنترنت.')}finally{clearTimeout(timeout)}let d;try{d=await r.json()}catch{throw Error('استجابة غير صالحة من الخادم')}if(!r.ok)throw Error(d.error||'HTTP '+r.status);return d}function panel(name){for(let n of ['list','edit','new'])$(n+'Panel').classList.toggle('hidden',n!==name)}function guard(){return !current||$('editContent').value===current.content||confirm('توجد تعديلات غير محفوظة. هل تريد المغادرة؟')}async function load(){message('listStatus','جارٍ التحميل...');try{let d=await api('/api/editor-articles');articles=d.articles||[];render();message('listStatus','عدد المقالات: '+articles.length,true)}catch(e){message('listStatus',e.message,false)}}function render(){let q=$('search').value.trim().toLowerCase(),box=$('articleList');box.replaceChildren();for(let a of articles.filter(x=>x.slug.toLowerCase().includes(q))){let row=document.createElement('div'),name=document.createElement('span'),btn=document.createElement('button');row.className='article';name.textContent=a.slug;btn.textContent='فتح وتعديل';btn.onclick=()=>openArticle(a.slug);row.append(name,btn);box.append(row)}if(!box.children.length)box.textContent='لا توجد مقالات مطابقة'}async function openArticle(slug){if(busy)return;busy=true;message('listStatus','جارٍ فتح المقال...');try{let d=await api('/api/editor-articles?slug='+encodeURIComponent(slug));current={slug:d.slug,sha:d.sha,content:d.content};$('editingName').textContent=d.slug;$('editContent').value=d.content;message('editStatus','');panel('edit');window.scrollTo(0,0)}catch(e){message('listStatus',e.message,false)}finally{busy=false}}async function save(){if(!current||busy)return;let content=$('editContent').value;if(!/^---\r?\n/.test(content)){message('editStatus','يجب أن يبدأ الملف بعلامات ---',false);return}busy=true;$('saveEditBtn').disabled=true;message('editStatus','جارٍ الحفظ...');try{let d=await api('/api/editor-manage',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug:current.slug,sha:current.sha,content})});current.sha=d.sha;current.content=content;message('editStatus','تم الحفظ في GitHub. انتظر نشر Cloudflare.',true)}catch(e){message('editStatus',e.message,false)}finally{busy=false;$('saveEditBtn').disabled=false}}async function remove(){if(!current||busy)return;let slug=current.slug;if(prompt('للتأكيد، اكتب اسم المقال المراد حذفه:\n'+slug)!==slug)return;busy=true;$('deleteBtn').disabled=true;message('editStatus','جارٍ الحذف...');try{await api('/api/editor-manage',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug,sha:current.sha})});current=null;panel('list');await load();message('listStatus','تم الحذف من GitHub. انتظر نشر Cloudflare.',true)}catch(e){message('editStatus',e.message,false)}finally{busy=false;$('deleteBtn').disabled=false}}$('logoutBtn').onclick=async()=>{if(!guard())return;if(!confirm('هل تريد تسجيل الخروج؟'))return;try{await api('/api/editor-logout',{method:'POST',headers:{'Content-Type':'application/json'}});location.replace('/editor/')}catch(e){alert(e.message)}};$('search').oninput=render;$('refreshBtn').onclick=load;$('listTab').onclick=()=>{if(!guard())return;current=null;panel('list');load()};$('newTab').onclick=()=>{if(!guard())return;current=null;panel('new')};$('cancelEditBtn').onclick=()=>{if(!guard())return;current=null;panel('list');load()};$('saveEditBtn').onclick=save;$('deleteBtn').onclick=remove;$('articleForm').onsubmit=async e=>{e.preventDefault();let b=$('publishBtn');b.disabled=true;message('publishStatus','جارٍ الحفظ...');let data={title:$('title').value.trim(),slug:$('slug').value.trim(),description:$('description').value.trim(),date:$('date').value,category:$('category').value.trim(),tags:$('tags').value.split(',').map(s=>s.trim()).filter(Boolean),cover:$('cover').value.trim(),body:$('body').value,draft:$('draft').checked,featured:$('featured').checked};try{await api('/api/editor-publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});message('publishStatus','تم حفظ المقال في GitHub.',true)}catch(err){message('publishStatus',err.message,false)}finally{b.disabled=false}};window.addEventListener('beforeunload',e=>{if(current&&$('editContent').value!==current.content){e.preventDefault();e.returnValue=''}});let d=new Date();$('date').value=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);(async()=>{try{let s=await api('/api/editor-status');if(!s.authenticated)throw Error('غير مسجل');$('loginBox').classList.add('hidden');$('editorBox').classList.remove('hidden');$('logoutBtn').classList.remove('hidden');await load()}catch(e){$('loginStatus').textContent='سجّل الدخول باستخدام GitHub، أو أعد تحميل الصفحة.'}})();
</script></body></html>
