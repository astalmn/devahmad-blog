
name: Publish DevAhmad Media

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract media edition
        shell: bash
        run: |
          set -euo pipefail

          ZIP="devahmad-media.zip"
          PROJECT="/tmp/devahmad-media/devahmad"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: devahmad-media.zip not found"
            exit 1
          fi

          mkdir -p /tmp/devahmad-media
          unzip -q "$ZIP" -d /tmp/devahmad-media

          if [ ! -f "$PROJECT/package.json" ]; then
            echo "ERROR: Invalid project structure"
            exit 1
          fi

          echo "Project extracted successfully"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and test
        working-directory: /tmp/devahmad-media/devahmad
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Replace project files
        shell: bash
        run: |
          set -euo pipefail

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            /tmp/devahmad-media/devahmad/ ./

          rm -f devahmad-media.zip

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi

          git commit -m "Publish DevAhmad media edition"
          git push origin HEAD:main
