
name: Publish Arabic DevAhmad

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Prepare Arabic project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="devahmad-arabic-el-messiri.zip"
          PROJECT="/tmp/devahmad-ar/devahmad"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          mkdir -p /tmp/devahmad-ar
          unzip -q "$ZIP" -d /tmp/devahmad-ar

          if [ ! -f "$PROJECT/package.json" ]; then
            echo "ERROR: Invalid project structure"
            exit 1
          fi

      - name: Fix reading time calculation
        shell: bash
        run: |
          set -euo pipefail

          FILE="/tmp/devahmad-ar/devahmad/src/pages/blog/[...slug].astro"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Article page not found"
            exit 1
          fi

          python3 - "$FILE" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          content = path.read_text()

          old = "post.body.split("
          new = "(post.body ?? '').split("

          if old not in content:
              print("ERROR: Expected code not found")
              sys.exit(1)

          content = content.replace(old, new)
          path.write_text(content)

          print("Reading time calculation fixed")
          PY

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Arabic project
        working-directory: /tmp/devahmad-ar/devahmad
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Replace old project
        shell: bash
        run: |
          set -euo pipefail

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            /tmp/devahmad-ar/devahmad/ ./

          rm -f devahmad-arabic-el-messiri.zip

      - name: Commit and publish
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi

          git commit -m "Publish Arabic-only DevAhmad"
          git push origin HEAD:main
