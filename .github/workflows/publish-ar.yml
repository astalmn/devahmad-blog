
name: Publish Arabic DevAhmad

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Prepare Arabic project
        run: |
          set -e

          ZIP="devahmad-arabic-el-messiri.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP file not found: $ZIP"
            exit 1
          fi

          mkdir -p /tmp/devahmad-ar
          unzip -q "$ZIP" -d /tmp/devahmad-ar

          PROJECT="/tmp/devahmad-ar/devahmad"

          if [ ! -f "$PROJECT/package.json" ]; then
            echo "Invalid ZIP structure"
            exit 1
          fi

          echo "Arabic project extracted successfully"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Arabic project
        working-directory: /tmp/devahmad-ar/devahmad
        run: |
          npm ci
          npm run build

      - name: Replace old project
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.github/workflows/publish-ar.yml' \
            /tmp/devahmad-ar/devahmad/ ./

          rm -f devahmad-arabic-el-messiri.zip

      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi

          git commit -m "Publish Arabic-only DevAhmad"
          git push origin HEAD:main
          
